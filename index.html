<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;max-width:480px;margin:auto;display:flex;flex-direction:column;background:#fff}
/* Navigation bar */
.nav{position:relative;flex:none;height:calc(44px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;padding-left:8px;padding-right:8px;
background:linear-gradient(#b4c1d4 0%,#8ea1bf 49%,#6d84a9 50%,#7b91b4 100%);border-bottom:1px solid #2d3642;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 3px rgba(0,0,0,.5);z-index:5}
.nav::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.08));pointer-events:none}
.nav h1{position:absolute;left:70px;right:70px;bottom:0;height:44px;line-height:44px;margin:0;text-align:center;font-size:20px;font-weight:bold;color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{position:relative;z-index:2;height:30px;padding:0 12px;border:1px solid #2a3a58;border-radius:5px;font:bold 12px "Helvetica Neue",Arial,sans-serif;color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.5);
background:linear-gradient(#8fa6cc 0%,#6b87b8 50%,#4a6aa3 50%,#5a78ae 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 0 rgba(255,255,255,.35);overflow:hidden}
.btn::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.1));pointer-events:none}
.btn:active{background:linear-gradient(#5a74a0,#3b5788 50%,#2e4a7c 50%,#3c5a8c)}
.btn.back{padding-left:14px;border-radius:3px 5px 5px 3px}
.btn.back::before{content:"";position:absolute;left:-9px;top:4px;width:18px;height:18px;transform:rotate(45deg);border-left:1px solid #2a3a58;border-bottom:1px solid #2a3a58;background:linear-gradient(135deg,#6b87b8,#4a6aa3)}
.btn.hide{visibility:hidden}
/* List */
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff}
.row{display:flex;align-items:center;height:70px;padding:0 12px 0 10px;border-bottom:1px solid #d3d3d3;color:#000;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.row:active,.row.sel{background:linear-gradient(#3e9bf0,#0a62d6);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.4)}
.row:active .sub,.row.sel .sub{color:#d6e8ff}
.meta{flex:1;min-width:0;margin-left:12px}
.ttl{font-size:17px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:#7a7a7a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;width:10px;height:10px;margin:0 8px 0 10px;border-top:3px solid #2f6bd0;border-right:3px solid #2f6bd0;transform:rotate(45deg);filter:drop-shadow(1px -1px 0 rgba(255,255,255,.9)) drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.row:active .chev,.row.sel .chev{border-color:#fff;filter:none}
.sec{height:22px;line-height:22px;padding-left:12px;font-weight:bold;font-size:15px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);background:linear-gradient(#a6b2c0,#8794a4);border-top:1px solid #b9c3cf;border-bottom:1px solid #6f7b89}
/* Album art */
.art{position:relative;flex:none;width:52px;height:52px;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.35)}
.art b{font:bold 26px Georgia,serif;color:rgba(255,255,255,.88);text-shadow:0 2px 3px rgba(0,0,0,.5)}
.art::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.12));pointer-events:none}
.art.round{border-radius:26px}
/* Tab bar */
.tabs{flex:none;position:relative;display:flex;height:calc(49px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(#3a3a3a 0%,#1b1b1b 49%,#000 50%,#0d0d0d 100%);border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:3px;font-size:10px;font-weight:bold;color:#929292;text-shadow:0 -1px 0 #000}
.tab svg{width:30px;height:28px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.18))}
.tab svg *{fill:url(#gi);stroke:#000;stroke-width:.6}
.tab.on{color:#4fd8ff;background:linear-gradient(rgba(70,140,200,.35),rgba(20,50,90,.25))}
.tab.on svg{filter:drop-shadow(0 0 5px rgba(60,200,255,.9))}
.tab.on svg *{fill:url(#gc)}
/* Cover Flow */
#cf{position:fixed;inset:0;max-width:480px;margin:auto;background:#000;z-index:20;display:none;flex-direction:column}
#cf.open{display:flex}
.cfnav{background:linear-gradient(rgba(70,70,75,.95),rgba(15,15,18,.95));border-bottom:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.cfnav::before{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.03))}
#stage{flex:1;position:relative;perspective:900px;perspective-origin:50% 35%;overflow:hidden;touch-action:none}
.item{position:absolute;left:50%;top:12%;width:var(--s);height:var(--s);margin-left:calc(var(--s) / -2);transform-style:preserve-3d;-webkit-box-reflect:below 0px -webkit-gradient(linear,left top,left bottom,from(transparent),to(rgba(255,255,255,0.4)))}
.item .art{width:100%;height:100%;border-radius:0;box-shadow:none}
.item .art b{font-size:calc(var(--s) * .45)}
.item .art::after{height:50%;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.05))}
.cfinfo{flex:none;text-align:center;color:#fff;padding:6px 16px calc(22px + env(safe-area-inset-bottom,0px));height:calc(92px + env(safe-area-inset-bottom,0px))}
.cfinfo .t{font-size:17px;font-weight:bold;text-shadow:0 -1px 0 #000}
.cfinfo .a{font-size:14px;color:#bbb;margin-top:2px}
.cfinfo .n{font-size:12px;color:#777;margin-top:6px}
#store{position:fixed;inset:0;max-width:480px;margin:auto;background:#fff;z-index:30;display:none;flex-direction:column}
#store.open{display:flex}
#sl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.buy{flex:none;width:84px;height:28px;margin-left:8px;border:1px solid #4d5d78;border-radius:4px;position:relative;overflow:hidden;font:bold 11px "Helvetica Neue",Arial,sans-serif;text-transform:uppercase;color:#4a5a78;text-shadow:0 1px 0 rgba(255,255,255,.7);background:linear-gradient(#fdfdfd,#d4dbe6 50%,#bcc6d6 50%,#d2dae6);box-shadow:inset 0 1px 0 #fff,0 1px 0 rgba(255,255,255,.8)}
.buy.arm{color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.45);border-color:#3a6f1c;background:linear-gradient(#b4de94,#62ab38 50%,#4a8f25 50%,#6ab43f);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.buy.done{color:#8a8a8a;border-color:#a8a8a8;background:linear-gradient(#f4f4f4,#dcdcdc 50%,#cfcfcf 50%,#dedede)}

.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 18px;border-radius:10px;background:rgba(0,0,0,.8);color:#fff;font-size:14px;font-weight:bold;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 8px rgba(0,0,0,.5);z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}

#now.open{display:flex}

.stagew{position:relative;flex:none;width:min(100%,calc(100dvh - 215px - env(safe-area-inset-top,0px)));aspect-ratio:1;margin:0 auto;perspective:1100px}

.rm{display:none;flex:none;position:relative;overflow:hidden;height:30px;padding:0 10px;margin-left:8px;border:1px solid #6a0a0a;border-radius:5px;font:bold 12px "Helvetica Neue",Arial,sans-serif;color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.5);background:linear-gradient(#f59a8c,#e0412c 50%,#c0220c 50%,#e04a34);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

.sec.eh{display:flex;align-items:center;justify-content:space-between;height:30px;padding-right:8px}

async function flac(f){const b=new Uint8Array(await f.slice(0,Math.min(f.size,12e6)).arrayBuffer());
 if(b[0]!=102||b[1]!=76||b[2]!=97||b[3]!=67)return null;
 const dv=new DataView(b.buffer),r={};let p=4;
 while(p+4<=b.length){const last=b[p]>>7,t=b[p]&127,n=(b[p+1]<<16)|(b[p+2]<<8)|b[p+3],s=p+4;if(s+n>b.length)break;
  if(t==4){let q=s+4+dv.getUint32(s,true),c=dv.getUint32(q,true);q+=4;
   while(c--&&q+4<=s+n){const l=dv.getUint32(q,true),str=new TextDecoder().decode(b.subarray(q+4,q+4+l)),i=str.indexOf("=");q+=4+l;
    if(i>0){const k=str.slice(0,i).toLowerCase(),v=str.slice(i+1).trim();if(k=="title"||k=="artist"||k=="album")r[k]=v}}}
  else if(t==6&&!r.img){let q=s+4;const ml=dv.getUint32(q),mime=T(b,q+4,q+4+ml,0);q+=4+ml;q+=4+dv.getUint32(q);q+=16;const dl=dv.getUint32(q);q+=4;r.img=new Blob([b.subarray(q,q+dl)],{type:mime||"image/jpeg"})}
  p=s+n;if(last)break}
 return r}
async function readTags(f){let r=null;try{r=await id3(f)||await flac(f)||(/\.(m4a|mp4|aac|m4b)$/i.test(f.name)||f.type.includes("mp4")?await mp4(f):null)}catch(e){}return r||{}}
const dataURL=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(b)});
const cvs=$("cvs");
/* Eliminar música */
function del(fn){const rm=new Set(songs.filter(fn)),oq=queue.map(i=>songs[i].url),cu=curSong;
 rm.forEach(x=>URL.revokeObjectURL(x.url));
 albums.forEach((al,i)=>{const keep=al.s.map((_,k)=>k).filter(k=>![...rm].some(x=>x.i==i&&x.k==k));["s","urls","ar"].forEach(p=>al[p]=keep.map(k=>al[p][k]))});
 for(let j=albums.length-1;j>=0;j--)if(!albums[j].s.length)albums.splice(j,1);
 mkSongs();cvs.textContent=albums.map((al,i)=>al.img?".cv"+i+"{background:#222 url("+al.img+") center/cover}":"").join("");
 queue=oq.map(u=>songs.findIndex(x=>x.url===u)).filter(i=>i>=0);
 if(cu&&rm.has(cu)){au.pause();au.removeAttribute("src");au.load();curSong=null;$("np").classList.remove("on");now.classList.remove("open")}
 else if(cu){curSong=songs.find(x=>x.url===cu.url);qi=queue.indexOf(songs.indexOf(curSong))}
 buildCF();pos=Math.min(pos,Math.max(0,albums.length-1));render(true);toast(rm.size>1?rm.size+" canciones eliminadas":"Canción eliminada")}
/* Archivos locales */
const fileIn=$("file");
fileIn.onchange=async()=>{const fs=[...fileIn.files].filter(f=>f.type.startsWith("audio")||/\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(f.name));
 if(!fs.length){toast("No se encontraron archivos de audio");return}

 toast("Leyendo tus archivos…");
 for(const f of fs){const m=await readTags(f);let t=m.title,ar=m.artist;
  if(!t){let n=f.name.replace(/\.[^.]+$/,"").replace(/_/g," ").trim();const x=n.split(" - ");if(x.length>1&&!ar){ar=x[0].trim();n=x.slice(1).join(" - ").trim()}t=n}
  ar=ar||"Artista desconocido";const an=m.album||"Álbum desconocido";
  let al=albums.find(x=>x.t.toLowerCase()==an.toLowerCase());
  if(!al){const hu=[...an].reduce((q,c)=>q+c.charCodeAt(0),0)%360;al={t:an,a:ar,c:["hsl("+hu+",60%,52%)","hsl("+hu+",65%,22%)"],g:an[0].toUpperCase(),s:[],urls:[],ar:[]};albums.push(al)}
  if(al.a!=ar)al.a="Varios artistas";
  al.s.push(t);al.ar.push(ar);const u=URL.createObjectURL(f);al.urls.push(u);{const a=new Audio();a.preload="metadata";a.onloadedmetadata=()=>{durs[u]=a.duration;songs.forEach(x=>{if(x.url===u)x.d=a.duration});render(true)};a.src=u}
  if(m.img&&!al.img){al.img=await dataURL(m.img);cvs.textContent+=".cv"+albums.indexOf(al)+"{background:#222 url("+al.img+") center/cover}"}}
 mkSongs();buildCF();fileIn.value="";toast(fs.length+(fs.length>1?" canciones agregadas":" canción agregada"))};
/* Tienda: solo para agregar música */
const store=[];
const sto=$("store"),sl=$("sl");
function drawStore(){sl.innerHTML='<div class="sec">Mi dispositivo</div><div class="row" id="pick"><div class="art" style="background:linear-gradient(135deg,#6a7f9f,#2b3a55)"><b>+</b></div><div class="meta"><div class="ttl">Agregar mis archivos</div><div class="sub">MP3, M4A, WAV y más desde tu iPhone</div></div><span class="chev"></span></div>'+store.map((al,k)=>`<div class="row"><div class="art" style="background:linear-gradient(135deg,${al.c[0]},${al.c[1]})"><b>${al.g}</b></div><div class="meta"><div class="ttl">${al.t}</div><div class="sub">${al.a} – ${al.s.length} canciones</div></div><button class="buy ${al.added?"done":al.arm?"arm":""}" data-k="${k}">${al.added?"Agregada":al.arm?"Confirmar":"Agregar"}</button></div>`).join("")}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
sl.onclick=e=>{if(e.target.closest("#pick")){fileIn.click();return}const b=e.target.closest(".buy");if(!b)return;const al=store[+b.dataset.k];if(al.added)return;
 if(!al.arm){store.forEach(x=>x.arm=false);al.arm=true;drawStore();return}
 al.arm=false;al.added=true;albums.push({t:al.t,a:al.a,c:al.c,g:al.g,s:al.s});mkSongs();buildCF();drawStore();toast("Agregada a tu biblioteca")};
const openStore=()=>{drawStore();sto.classList.add("open")};$("bl").onclick=()=>{if(det!=null){det=null;render()}else openStore()};
$("sd").onclick=()=>{store.forEach(x=>x.arm=false);sto.classList.remove("open");render()};
$("tabs").onclick=e=>{const t=e.target.closest(".tab");if(t){cur=t.dataset.n;edit=false;arm=null;det=null;render()}};
$("list").onclick=e=>{
 if(e.target.closest("#ebtn")){edit=!edit;arm=null;render(true);return}
 const tw=e.target.closest(".trw");if(tw){playSong(+tw.dataset.s,1);return}
 const r=e.target.closest(".row");if(!r)return;
 if(edit&&cur!="Más"){const k=r.dataset.k;
  if(e.target.closest(".mn")){arm=arm===k?null:k;render(true)}
  else if(e.target.closest(".rm")){arm=null;
   if(cur=="Canciones"){const t=songs[+k];del(x=>x===t)}
   else if(cur=="Artistas"){const a=decodeURIComponent(k);del(x=>x.a===a)}
   else del(x=>x.i==+k)}
  return}
 if(cur=="Más"){openStore();return}
 if(r.classList.contains("alb")){det=+r.dataset.k;render();return}
 document.querySelectorAll(".row.sel").forEach(x=>x.classList.remove("sel"));r.classList.add("sel");if(r.classList.contains("song"))playSong(+r.dataset.s)};
/* Cover Flow */
const stage=$("stage"),cf=$("cf");let pos=0,items=[],S=220;
function buildCF(){stage.innerHTML=albums.map((al,i)=>`<div class="item" data-i="${i}">${art(i)}</div>`).join("");items=[...stage.children]}buildCF();
items=[...stage.children];
function layout(anim){
 S=Math.min(window.innerWidth*.66,280,stage.clientHeight*(land()?.7:.54));
 stage.style.setProperty("--s",S+"px");
 items.forEach((el,i)=>{
  const d=i-pos,ad=Math.abs(d),s=Math.sign(d);let x,r,z;
  if(ad<1){x=d*.72*S;r=-d*60;z=(1-ad)*.35*S}
  else{x=s*(.72*S+(ad-1)*.2*S);r=-s*60;z=0}
  el.style.transition=anim?"transform .4s ease":"none";
  el.style.transform=`translateX(${x}px) translateZ(${z}px) rotateY(${r}deg)`;
  el.style.zIndex=100-Math.round(ad*2);
 });
 const k=Math.round(pos),al=albums[k];if(!al)return;
 $("ct").textContent=al.t;$("ca").textContent=al.a;$("cn").textContent=(k+1)+" de "+albums.length+(curSong?"  \u2022  \u266a "+curSong.t:"");
}
function openCF(i){hideTL();cf.classList.add("open");pos=Math.max(0,Math.min(albums.length-1,i==null?Math.round(pos):i));layout(false)}
$("br").onclick=()=>{if(det!=null){openNow();return}if(!albums.length){toast("Agrega música desde Tienda");return}openCF(Math.round(pos))};
$("cfb").onclick=()=>cf.classList.remove("open");
window.addEventListener("resize",()=>layout(false));
/* Girar el iPhone abre Cover Flow */
function land(){return innerWidth>innerHeight&&innerHeight<500}
let autoCF=false,wasLand=land();
function orient(){
 const l=land();
 if(l){if(albums.length&&!$("store").classList.contains("open")&&!cf.classList.contains("open")){autoCF=true;$("now").classList.remove("open");openCF(curSong?curSong.i:null)}}
 else if(wasLand){autoCF=false;hideTL();cf.classList.remove("open")}
 wasLand=l}
window.addEventListener("resize",orient);
window.addEventListener("orientationchange",()=>setTimeout(orient,200));
let sx=0,sp=0,drag=false,moved=false,lx=0,lt=0,vel=0;
const clamp=v=>Math.max(0,Math.min(albums.length-1,v));
function start(x){hideTL();drag=true;moved=false;sx=lx=x;sp=pos;lt=performance.now();vel=0}
function move(x){if(!drag)return;const dx=x-sx;if(Math.abs(dx)>6)moved=true;
 const now=performance.now();vel=(x-lx)/Math.max(1,now-lt);lx=x;lt=now;
 pos=clamp(sp-dx/(S*.3));layout(false)}
function end(){if(!drag)return;drag=false;pos=clamp(Math.round(pos-vel*1.2));layout(true)}
stage.addEventListener("touchstart",e=>start(e.touches[0].clientX),{passive:true});
stage.addEventListener("touchmove",e=>{move(e.touches[0].clientX);e.preventDefault()},{passive:false});
stage.addEventListener("touchend",end);
stage.addEventListener("mousedown",e=>start(e.clientX));
window.addEventListener("mousemove",e=>move(e.clientX));
window.addEventListener("mouseup",end);
stage.addEventListener("click",e=>{if(moved||lpFired){lpFired=false;return}const it=e.target.closest(".item");if(it){const i=+it.dataset.i;if(i===Math.round(pos)){const k=songs.findIndex(s=>s.i===i&&s.url);if(k>=0){playSong(k,1,1)}else toast("Álbum de demostración. Agrega tus archivos desde Tienda.")}else{pos=i;layout(true)}}});
/* Mantener pulsada la carátula central: elegir pista sin salir del Cover Flow */
const tl=$("tl");let lpT=null,lpFired=false,tlI=0,tlAt=0;
function drawTL(){const al=albums[tlI];if(!al){hideTL();return}let h=`<div class="tlh">${esc(al.t)}<small>${esc(al.a)}</small></div>`;songs.forEach((x,k)=>{if(x.i==tlI)h+=`<div class="tlr${x===curSong?" on":""}" data-s="${k}"><span>${x===curSong?"\u25B6\uFE0E":x.k+1}</span><div>${esc(x.t)}</div><em>${x.d?fmt(x.d):""}</em></div>`});tl.innerHTML=h}
function showTL(i){tlI=i;tlAt=Date.now();drawTL();const r=stage.getBoundingClientRect(),c=cf.getBoundingClientRect();
 const W=Math.min(S*1.35,r.width-20);tl.style.cssText=`left:${r.left-c.left+r.width/2-W/2}px;top:${r.top-c.top+r.height*(land()?.08:.12)}px;width:${W}px;height:${S}px`;

function hideTL(){tl.classList.remove("on")}
$("cfp").onclick=()=>{if(curSong)au.paused?au.play():au.pause()};
$("cfi").onclick=()=>{if(tl.classList.contains("on"))hideTL();else showTL(Math.round(pos))};
function lpStart(e){clearTimeout(lpT);lpFired=false;const it=e.target.closest&&e.target.closest(".item");if(!it||+it.dataset.i!==Math.round(pos))return;

["touchstart","mousedown"].forEach(t=>stage.addEventListener(t,lpStart,{passive:true}));
["touchend","touchcancel","mouseup"].forEach(t=>window.addEventListener(t,()=>clearTimeout(lpT)));
["touchstart","touchmove","mousedown"].forEach(t=>tl.addEventListener(t,e=>e.stopPropagation(),{passive:true}));
tl.onclick=e=>{if(Date.now()-tlAt<600)return;const r=e.target.closest(".tlr");if(r){playSong(+r.dataset.s,1,1);drawTL()}else hideTL()};
document.addEventListener("keydown",e=>{if(!cf.classList.contains("open"))return;
